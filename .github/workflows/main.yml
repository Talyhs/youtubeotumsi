name: Daily Azerbaijani Facts Video

on:
  push:
    branches: [main]
    paths:
      - "youtube.py"
      - "sample_script_10_facts_az.txt"
      - ".github/workflows/main.yml"
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Baku"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-automation
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          ffmpeg -version
          ffprobe -version
          ffmpeg -filters 2>/dev/null | grep subtitles

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os

          # Gemini is optional: youtube.py falls back to the bundled Azerbaijani script.
          required = ("TOKEN_JSON",)
          missing = [
              name for name in required
              if not os.environ.get(name, "").strip()
          ]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))

          if not (
              os.environ.get("PEXELS_API_KEY", "").strip()
              or os.environ.get("PIXABAY_API_KEY", "").strip()
          ):
              raise SystemExit(
                  "Add at least one GitHub Secret: "
                  "PEXELS_API_KEY or PIXABAY_API_KEY"
              )

          try:
              token = json.loads(os.environ["TOKEN_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit("TOKEN_JSON is invalid JSON.") from exc

          if not token.get("refresh_token"):
              raise SystemExit("TOKEN_JSON must contain a refresh_token.")

          print("Required secrets and OAuth token validated.")
          print("Gemini enabled:", bool(os.environ.get("GEMINI_API_KEY", "").strip()))
          print("Pexels enabled:", bool(os.environ.get("PEXELS_API_KEY", "").strip()))
          print("Pixabay enabled:", bool(os.environ.get("PIXABAY_API_KEY", "").strip()))
          PY

      - name: Run YouTube automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          EDGE_TTS_VOICE: az-AZ-BabekNeural
          YOUTUBE_PRIVACY_STATUS: public
          TARGET_VIDEO_SECONDS: "193"
          PYTHONUNBUFFERED: "1"
        run: python youtube.py

      - name: Save final MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-final-video
          path: youtube_short.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Save subtitles and voiceover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-production-files
          path: |
            work/subtitles.ass
            work/voiceover.mp3
          if-no-files-found: ignore
          retention-days: 7

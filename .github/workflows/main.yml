
name: YouTube Automation

on:
  # Every day at 18:00 UTC (22:00 Azerbaijan time)
  schedule:
    - cron: "0 18 * * *"

  # Allows manual execution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-automation
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ==========================================
      # 1. Download repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. Install system dependencies
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      # ==========================================
      # 4. Configure ImageMagick for MoviePy
      # ==========================================
      - name: Configure ImageMagick
        run: |
          echo "ImageMagick version:"
          convert -version

          echo "Checking ImageMagick policy..."
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            grep -n "policy" /etc/ImageMagick-6/policy.xml || true
          fi

      # ==========================================
      # 5. Install Python dependencies
      # ==========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 6. Validate required secrets
      # ==========================================
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          required = [
              "GEMINI_API_KEY",
              "CLIENT_SECRETS_JSON",
              "TOKEN_JSON",
          ]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: "
                  + ", ".join(missing)
              )
          print("Required secrets are present.")
          PY

      # ==========================================
      # 7. Create Google OAuth files
      # ==========================================
      - name: Create Google OAuth files
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os

          files = {
              "client_secrets.json": "CLIENT_SECRETS_JSON",
              "token.json": "TOKEN_JSON",
          }

          for filename, env_name in files.items():
              content = os.environ[env_name]
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)

              with open(filename, encoding="utf-8") as f:
                  json.load(f)

              print(f"{filename} created and validated.")
          PY


      # ==========================================
      # 8. Run YouTube automation
      # ==========================================
      - name: Run YouTube automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Default model names are used if repository variables are empty.
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}

          # Optional video topic
          VIDEO_TOPIC: ${{ vars.VIDEO_TOPIC }}

          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os

          required = ["GEMINI_API_KEY"]
          missing = [name for name in required if not os.getenv(name, "").strip()]

          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          print("Text model:", os.getenv("GEMINI_TEXT_MODEL"))
          print("Image model:", os.getenv("GEMINI_IMAGE_MODEL"))
          print("Starting YouTube automation...")
          PY

          python youtube.py

      # ==========================================
      # 9. Upload generated video as artifact
      # ==========================================
      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: youtube_short.mp4
          if-no-files-found: warn
          retention-days: 7

      # ==========================================
      # 10. Upload generated AI background
      # ==========================================
      - name: Upload AI background
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-background
          path: |
            background.png
            background_video.jpg
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # 11. Upload generated voiceover
      # ==========================================
      - name: Upload voiceover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: voiceover.mp3
          if-no-files-found: warn
          retention-days: 7

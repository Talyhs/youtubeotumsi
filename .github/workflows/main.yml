name: YouTube Video Automation

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Istanbul"
    - cron: "0 14 * * *"
      timezone: "Europe/Istanbul"
    - cron: "0 19 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:
    inputs:
      topic:
        description: "Videoda danışılacaq mövzu və ya başlıq (məs: Fironlar: Antik Misirin sirləri)"
        required: true
        type: string
        default: "Firavunlar: Antik Mısır'ın Gizemleri"
      language:
        description: "Video dili"
        required: true
        type: choice
        options: [az, en, tr]
        default: tr
      duration:
        description: "Video müddəti — 600 saniyə = 10 dəqiqə"
        required: true
        type: choice
        options: ["30", "50", "55", "60", "180", "300", "600", "601"]
        default: "600"
      video_format:
        description: "Üfüqi = adi YouTube video; şaquli = Shorts"
        required: true
        type: choice
        options: [vertical, horizontal]
        default: vertical
      voice:
        description: "Səsin cinsi — seçilən AI səs provayderində tətbiq olunur"
        required: true
        type: choice
        options: [male, female, auto]
        default: male
      voice_provider:
        description: "Səsləndirən AI — EMA yalnız türk dili; Kokoro ingilis dili; Edge çoxdilli neyron səs"
        required: true
        type: choice
        options: [ema, edge, kokoro, elevenlabs, fliki, auto]
        default: ema
      stock_sources:
        description: "Stok mənbələri (vergüllə)"
        required: true
        type: string
        default: "Pixabay,Pexels"
      subtitles:
        description: "Subtitrlər"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      thumbnail:
        description: "Thumbnail yarat"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      seo:
        description: "SEO metadata"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      privacy:
        description: "Yalnız publish=upload olduqda YouTube-a yüklənir"
        required: true
        type: choice
        options: [private, unlisted, public]
        default: public
      publish:
        description: "prepare = yalnız hazırla və faylı ver; upload = YouTube-a yüklə"
        required: true
        type: choice
        options: [prepare, upload]
        default: prepare

permissions:
  contents: read

concurrency:
  group: youtube-automation
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEO_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
      VIDEO_LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'tr' }}
      TARGET_VIDEO_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration || '50' }}
      VIDEO_FORMAT: ${{ github.event_name == 'workflow_dispatch' && inputs.video_format || 'vertical' }}
      VOICE_GENDER: ${{ github.event_name == 'workflow_dispatch' && inputs.voice || 'male' }}
      VOICE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.voice_provider || 'ema' }}
      STOCK_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.stock_sources || 'Pixabay,Pexels' }}
      ADD_SUBTITLES: ${{ github.event_name == 'workflow_dispatch' && inputs.subtitles || 'true' }}
      CREATE_THUMBNAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.thumbnail || 'true' }}
      ENABLE_SEO: ${{ github.event_name == 'workflow_dispatch' && inputs.seo || 'true' }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy || 'public' }}
      AUTOMATION_END_DATE: '2027-10-14'
      TIMEZONE: Europe/Istanbul
      PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'upload' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-onnx-model-v1.1-${{ runner.os }}

      - name: Download Kokoro English voice model
        run: |
          mkdir -p .cache/kokoro
          if [ ! -s .cache/kokoro/kokoro-v1.0.onnx ]; then
            curl --fail --location --retry 3 --output .cache/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          fi
          if [ ! -s .cache/kokoro/voices-v1.0.bin ]; then
            curl --fail --location --retry 3 --output .cache/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi
          test -s .cache/kokoro/kokoro-v1.0.onnx
          test -s .cache/kokoro/voices-v1.0.bin
          ls -lh .cache/kokoro
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg melt fonts-dejavu-core espeak-ng
          ffmpeg -version
          ffprobe -version
          melt -version
          ffmpeg -filters 2>/dev/null | grep subtitles

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install EMA Lightning Turkish TTS CPU fallback
        run: |
          # Use CPU-only PyTorch so the runner does not download CUDA packages.
          pip install ema-lightning --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check Python syntax
        run: python -m py_compile youtube.py

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'upload' }}
        run: |
          python - <<'PY'
          import json
          import os
          required = ("GEMINI_API_KEY",) + (("TOKEN_JSON",) if os.environ.get("PUBLISH_MODE", "upload") == "upload" else ())
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))
          if not (os.environ.get("PEXELS_API_KEY", "").strip() or os.environ.get("PIXABAY_API_KEY", "").strip()):
              raise SystemExit("Add at least one GitHub Secret: PEXELS_API_KEY or PIXABAY_API_KEY")
          if os.environ.get("PUBLISH_MODE", "upload") == "upload":
              token = json.loads(os.environ["TOKEN_JSON"])
              if not token.get("refresh_token"):
                  raise SystemExit("TOKEN_JSON must contain a refresh_token.")
          print("Required secrets validated.")
          PY

      - name: Run YouTube automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_v3
          FLIKI_API_KEY: ${{ secrets.FLIKI_API_KEY }}
          FLIKI_VOICE_ID: ${{ secrets.FLIKI_VOICE_ID }}
          FLIKI_VOICE_STYLE_ID: ${{ secrets.FLIKI_VOICE_STYLE_ID }}
          VOICE_PROVIDER: ${{ env.VOICE_PROVIDER }}
          KOKORO_VOICE: am_michael
          KOKORO_MODEL_PATH: .cache/kokoro/kokoro-v1.0.onnx
          KOKORO_VOICES_PATH: .cache/kokoro/voices-v1.0.bin
          SD_WEBUI_URL: ${{ secrets.SD_WEBUI_URL }}
          SD_WEBUI_USERNAME: ${{ secrets.SD_WEBUI_USERNAME }}
          SD_WEBUI_PASSWORD: ${{ secrets.SD_WEBUI_PASSWORD }}
          SD_WEBUI_REQUIRED: ${{ secrets.SD_WEBUI_REQUIRED }}
          SD_WEBUI_STEPS: "25"
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          PYTHONUNBUFFERED: "1"
        run: python youtube.py

      - name: Optional Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram notification skipped: secrets not configured.")
          else:
              text = f"Talyhs Studio: workflow {os.environ['JOB_STATUS']}\n{os.environ['RUN_URL']}"
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": text},
                  timeout=15,
              )
              response.raise_for_status()
              print("Telegram notification sent.")
          PY

      - name: Save final MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-final-video
          path: youtube_short.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Save production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-production-files
          path: |
            work/subtitles.ass
            work/voiceover.mp3
            work/thumbnail.jpg
            work/metadata.json
          if-no-files-found: ignore
          retention-days: 7

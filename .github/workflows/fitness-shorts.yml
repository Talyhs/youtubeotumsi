name: Turkish Fitness Shorts Bot

on:
  pull_request:
    paths:
      - 'youtube_fitnes_talyhs/**'
      - '.github/workflows/fitness-shorts.yml'
      - '.github/dependabot.yml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = yalnızca video hazırla; upload = doğrulanmış ikinci kanala yükle"
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - upload
      topic:
        description: "İsteğe bağlı fitness Shorts konusu"
        type: string
        required: false
        default: ""
      duration:
        description: "Video süresi (saniye)"
        type: choice
        required: true
        default: "45"
        options:
          - "30"
          - "45"
          - "60"
      voice:
        description: "Türkçe sinirsel ses"
        type: choice
        required: true
        default: female
        options:
          - female
          - male
          - auto
      confirm_upload:
        description: "Explicitly approve publishing this run (required when mode=upload)"
        type: boolean
        required: true
        default: false
      whisper:
        description: "Kelime düzeyinde altyazı zamanlaması için Whisper kullan (ilk çalıştırma daha yavaş)"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
  schedule:
    # Turkey time (UTC+3): 07:30, 12:00, 18:30. Scheduled runs only prepare videos.
    - cron: "30 4 * * *"
    - cron: "0 9 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-fitness-shorts
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r youtube_fitnes_talyhs/requirements.txt -r youtube_fitnes_talyhs/requirements-dev.txt
      - name: Check Python syntax
        run: python -m py_compile youtube_fitnes_talyhs/youtube.py youtube_fitnes_talyhs/quality.py
      - name: Lint critical Python errors
        run: ruff check --select E9,F63,F7,F82 youtube_fitnes_talyhs tests
      - name: Run unit tests
        run: pytest -q

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prepare' }}
      FITNESS_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
      VIDEO_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration || '45' }}
      EDGE_TTS_VOICE: ${{ github.event_name == 'workflow_dispatch' && inputs.voice == 'male' && 'tr-TR-AhmetNeural' || github.event_name == 'workflow_dispatch' && inputs.voice == 'female' && 'tr-TR-EmelNeural' || vars.EDGE_TTS_VOICE || 'tr-TR-EmelNeural' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TOKEN_JSON: ${{ secrets.FITNESS_TOKEN_JSON }}
      YOUTUBE_CHANNEL_ID: ${{ vars.FITNESS_YOUTUBE_CHANNEL_ID }}
      ALLOW_PUBLIC_UPLOAD: ${{ vars.FITNESS_ALLOW_PUBLIC_UPLOAD || 'NO' }}
      CONFIRM_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_upload == true && 'YES' || 'NO' }}
      USE_WHISPER_CAPTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.whisper == 'yes' && 'YES' || vars.USE_WHISPER_CAPTIONS || 'NO' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube_fitnes_talyhs/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        working-directory: youtube_fitnes_talyhs
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install optional Whisper alignment engine
        if: env.USE_WHISPER_CAPTIONS == 'YES'
        working-directory: youtube_fitnes_talyhs
        run: pip install -r requirements-whisper.txt
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$PEXELS_API_KEY" && -z "$PIXABAY_API_KEY" ]]; then
            echo "Missing stock video API key. Add PEXELS_API_KEY or PIXABAY_API_KEY to repository Secrets."
            exit 1
          fi
          if [[ "$PUBLISH_MODE" == "upload" ]]; then
            [[ -n "$TOKEN_JSON" ]] || { echo "Missing FITNESS_TOKEN_JSON secret"; exit 1; }
            [[ -n "$YOUTUBE_CHANNEL_ID" ]] || { echo "Missing FITNESS_YOUTUBE_CHANNEL_ID variable"; exit 1; }
            [[ "$CONFIRM_UPLOAD" == "YES" ]] || { echo "Upload blocked. Tick confirm_upload only after reviewing the generated video."; exit 1; }
            [[ "$ALLOW_PUBLIC_UPLOAD" == "YES" ]] || { echo "Upload blocked. Set FITNESS_ALLOW_PUBLIC_UPLOAD=YES only after testing."; exit 1; }
          fi
      - name: Generate fitness Short
        working-directory: youtube_fitnes_talyhs
        run: python youtube.py
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-fitness-shorts
          path: youtube_fitnes_talyhs/output/
          if-no-files-found: warn
          retention-days: 7

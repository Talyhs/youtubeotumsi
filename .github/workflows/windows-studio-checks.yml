name: Windows Studio checks

on:
  push:
    branches: [feature/talyhs-studio-windows, feature/talyhs-studio-full-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest Pillow requests
      - run: python -m py_compile app.py youtube.py desktop_app.py studio/*.py
      - run: pytest -q tests

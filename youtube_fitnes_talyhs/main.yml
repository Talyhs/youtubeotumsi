name: English Fitness Shorts Bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare creates a video; upload sends it to YouTube
        type: choice
        required: true
        default: prepare
        options: [prepare, upload]
  schedule:
    - cron: '0 16 * * *'
permissions:
  contents: read
concurrency:
  group: youtube-fitness-shorts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prepare' }}
      VIDEO_SECONDS: '45'
      EDGE_TTS_VOICE: en-US-GuyNeural
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      ALLOW_PUBLIC_UPLOAD: ${{ vars.ALLOW_PUBLIC_UPLOAD || 'NO' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate credentials
        shell: bash
        run: |
          if [[ -z "$PEXELS_API_KEY" && -z "$PIXABAY_API_KEY" ]]; then echo 'Add PEXELS_API_KEY or PIXABAY_API_KEY in GitHub Secrets.'; exit 1; fi
          if [[ "$PUBLISH_MODE" == 'upload' ]]; then
            [[ -n "$TOKEN_JSON" ]] || { echo 'TOKEN_JSON secret is missing'; exit 1; }
            [[ -n "$YOUTUBE_CHANNEL_ID" ]] || { echo 'YOUTUBE_CHANNEL_ID repository variable is missing'; exit 1; }
            [[ "$ALLOW_PUBLIC_UPLOAD" == 'YES' ]] || { echo 'Upload blocked. Set ALLOW_PUBLIC_UPLOAD=YES after testing.'; exit 1; }
          fi
      - name: Generate video and optionally upload
        run: python youtube.py
      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-fitness-shorts
          path: output/
          if-no-files-found: warn
          retention-days: 7
